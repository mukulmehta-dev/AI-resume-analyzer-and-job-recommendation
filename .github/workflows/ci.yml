name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Test Database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "CREATE DATABASE resume_analyzer_test;"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/resume_analyzer
          PYTHONPATH: .
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/resume_analyzer
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/resume_analyzer_test
          PYTHONPATH: .
        run: |
          pytest -v -rs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: |
          npm run build

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: ai-resume-analyzer-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-resume-analyzer-frontend:latest
