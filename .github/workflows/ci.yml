name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Test Database
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "CREATE DATABASE resume_analyzer_test;"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/resume_analyzer
          JWT_SECRET: ci_test_super_secret_jwt_key_resume_analyzer_2026
          ENV: test
          ADMIN_PASSWORD: adminpassword123
          UPLOAD_DIR: data/uploads
          PYTHONPATH: .
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/resume_analyzer
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/resume_analyzer_test
          JWT_SECRET: ci_test_super_secret_jwt_key_resume_analyzer_2026
          ENV: test
          ADMIN_PASSWORD: adminpassword123
          UPLOAD_DIR: data/uploads
          PYTHONPATH: .
        run: |
          pytest -v -rs 2>&1 | tee pytest_output.log

      - name: Report Pytest Results
        if: always()
        run: |
          if [ -f pytest_output.log ]; then
            echo "## Pytest Output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: |
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: ai-resume-analyzer-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: ai-resume-analyzer-frontend:latest

  docker-e2e:
    needs: test-and-build
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: test_postgres_password_123
      ADMIN_PASSWORD: test_admin_password_123
      JWT_SECRET: test_jwt_secret_for_docker_e2e_32chars
      ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install E2E Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests reportlab python-docx

      - name: Validate Docker Compose Configuration
        env:
          POSTGRES_PASSWORD: test_postgres_password_123
          ADMIN_PASSWORD: test_admin_password_123
          JWT_SECRET: test_jwt_secret_for_docker_e2e_32chars
          GEMINI_API_KEY: ci_test_gemini_api_key
        run: |
          docker compose config > compose_resolved.yml
          grep -q "GEMINI_API_KEY" compose_resolved.yml || (echo "GEMINI_API_KEY not found in docker compose config" && exit 1)
          echo "Validated GEMINI_API_KEY presence in docker compose config"

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d --build --wait

      - name: Run E2E Verification
        env:
          BASE_URL: http://localhost
        run: |
          python scripts/e2e.py

      - name: Dump Docker Compose Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Tear Down Docker Compose
        if: always()
        run: |
          docker compose down -v || true
